# FILE: policies/email-triage.v1.yaml
id: email-triage
version: 1.0.0

defaults:
  approvalThreshold: 0.75
  unknownIntentRisk: MEDIUM

  # Outlook categories are strings; ensure these exist in your mailbox or create them in setup.
  categories:
    newsletter: "ReadLater/Newsletter"
    receipt: "Records/Receipt"
    spamCandidate: "SpamCandidate"
    triageAction: "Triage/Action"
    triageFYI: "Triage/FYI"
    scheduling: "Triage/Scheduling"

  # Folder mapping - executor resolves to folderId or uses well-known name.
  # Recommend using "archive" as a symbolic name; executor maps it to the correct folder.
  folders:
    archive: "Archive"

  senderAllowlist:
    - "boss@company.com"
    - "cto@company.com"

  senderBlocklistDomains:
    - "cheap-deals.example"
    - "spammy-mailer.example"

  conflictResolution:
    askHumanBlocksMoveToArchive: true

rules:
  # ----------------------------
  # 1100 = hard filters
  # ----------------------------

  - id: blocklist-domain-spam-candidate
    priority: 1100
    when:
      any:
        - field: "from.email"
          op: domain_in
          value: "${defaults.senderBlocklistDomains}"
        - all:
            - field: "signals.isBulk"
              op: eq
              value: true
            - field: "signals.isAutomated"
              op: eq
              value: true
            - field: "signals.hasUnsubscribe"
              op: eq
              value: true
            - field: "subject"
              op: matches
              value: "(?i)free money|get rich|winner|act now"
    setClassification:
      intent: SPAM
      urgency: SOMEDAY
      risk: LOW
      confidence: 0.95
      rationale:
        - "Sender domain blocklist or strong spam heuristics matched."
    actions:
      - type: CATEGORY
        name: "${defaults.categories.spamCandidate}"
      - type: MOVE
        folder: "${defaults.folders.archive}"
    terminal: true

  # ----------------------------
  # 900 = automated/bulk mail
  # ----------------------------

  - id: newsletter-auto-archive
    priority: 900
    when:
      any:
        - field: "signals.hasUnsubscribe"
          op: eq
          value: true
        - all:
            - field: "signals.isBulk"
              op: eq
              value: true
            - field: "signals.isAutomated"
              op: eq
              value: true
    setClassification:
      intent: NEWSLETTER
      urgency: SOMEDAY
      risk: LOW
      confidence: 0.9
      rationale:
        - "Bulk/automated indicators present (unsubscribe or bulk+automated)."
    actions:
      - type: CATEGORY
        name: "${defaults.categories.newsletter}"
      - type: MOVE
        folder: "${defaults.folders.archive}"
    terminal: true

  - id: receipt-auto-archive
    priority: 880
    when:
      all:
        - field: "signals.mentionsMoney"
          op: eq
          value: true
        - any:
            - field: "subject"
              op: matches
              value: "(?i)receipt|invoice|order|payment|paid|statement"
            - field: "bodyPreview"
              op: matches
              value: "(?i)receipt|invoice|order|payment|paid|total|amount"
    setClassification:
      intent: RECEIPT
      urgency: SOMEDAY
      risk: LOW
      confidence: 0.9
      rationale:
        - "Money mention plus receipt/invoice/order keywords."
    actions:
      - type: CATEGORY
        name: "${defaults.categories.receipt}"
      - type: MOVE
        folder: "${defaults.folders.archive}"
    terminal: true

  # ----------------------------
  # 700 = scheduling / coordination
  # ----------------------------

  - id: scheduling-draft
    priority: 700
    when:
      any:
        - field: "signals.mentionsMeeting"
          op: eq
          value: true
        - field: "extracted.intent"
          op: eq
          value: SCHEDULING
    setClassification:
      intent: SCHEDULING
      urgency: THIS_WEEK
      risk: MEDIUM
      confidence: 0.8
      rationale:
        - "Meeting/scheduling signals detected."
    actions:
      - type: CATEGORY
        name: "${defaults.categories.scheduling}"
      - type: DRAFT_REPLY
        template: scheduling_ack
        requiresApproval: true
    terminal: true

  # ----------------------------
  # 600 = explicit approvals
  # ----------------------------

  - id: approval-request-ask-human
    priority: 600
    when:
      any:
        - field: "extracted.intent"
          op: eq
          value: APPROVAL_REQUEST
        - field: "subject"
          op: matches
          value: "(?i)approve|sign[- ]?off|permission|can you confirm|please confirm"
    setClassification:
      intent: APPROVAL_REQUEST
      urgency: NOW
      risk: HIGH
      confidence: 0.85
      rationale:
        - "Approval language detected."
    actions:
      - type: ASK_HUMAN
        question: "This appears to require a decision/approval. What should we do?"
    terminal: true

  # ----------------------------
  # 500 = action required
  # ----------------------------

  - id: action-required-create-task
    priority: 500
    when:
      any:
        - field: "signals.asksForAction"
          op: eq
          value: true
        - field: "extracted.intent"
          op: eq
          value: ACTION_REQUIRED
        - field: "subject"
          op: matches
          value: "(?i)action required|request|can you|could you|please"
    setClassification:
      intent: ACTION_REQUIRED
      urgency: THIS_WEEK
      risk: MEDIUM
      confidence: 0.8
      rationale:
        - "Action/request cues detected."
    actions:
      - type: CATEGORY
        name: "${defaults.categories.triageAction}"
      - type: CREATE_TASK
        template: action_required
      - type: FLAG
        flagStatus: flagged
    terminal: true

  # ----------------------------
  # 300 = FYI / informational
  # ----------------------------

  - id: fyi-reading-pack
    priority: 300
    when:
      any:
        - field: "extracted.intent"
          op: eq
          value: FYI
        - all:
            - field: "signals.isAutomated"
              op: eq
              value: false
            - field: "signals.asksForAction"
              op: eq
              value: false
    setClassification:
      intent: FYI
      urgency: SOMEDAY
      risk: LOW
      confidence: 0.78
      rationale:
        - "No action cues; treat as FYI."
    actions:
      - type: CATEGORY
        name: "${defaults.categories.triageFYI}"
      - type: CREATE_READING_PACK
        template: reading_pack_entry
        notePath: "Inbox/Reading Packs/{{date:YYYY-MM-DD}}.md"
    terminal: true

  # ----------------------------
  # 0 = fallback
  # ----------------------------

  - id: fallback-unknown-ask-human
    priority: 0
    when:
      any:
        - field: "extracted.confidence"
          op: lte
          value: 0.74
        - field: "extracted.intent"
          op: eq
          value: UNKNOWN
    setClassification:
      intent: UNKNOWN
      urgency: SOMEDAY
      risk: MEDIUM
      confidence: 0.5
      rationale:
        - "Insufficient confidence/intent unknown."
    actions:
      - type: ASK_HUMAN
        question: "Unclear what to do with this email. Keep, archive, task, read-pack, or draft?"
    terminal: true
