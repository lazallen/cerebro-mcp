# Default Policy: Multi-Source Triage v2
# Updated for the new item-per-file design.
# Action types: TRIAGE, MOVE, FLAG, LABEL, CREATE_TASK, JOURNAL_NOTE, RESPOND_CALENDAR, ARCHIVE
#
# Priority tiers:
#   1100+ = hard filters (spam, blocklist)
#   900-1099 = automated/bulk mail
#   700-899 = scheduling / coordination
#   600-699 = approvals
#   500-599 = action required
#   300-499 = FYI / informational
#   100-299 = delegatable / low priority
#   0-99    = fallback

id: default-triage
version: 2.0.0

defaults:
  # Confidence below this → safety gates add TRIAGE
  approvalThreshold: 0.75

  # Confidence below this → suggest enrichment
  claudeRecommendThreshold: 0.60

  # Risk level assigned when intent = UNKNOWN
  unknownIntentRisk: MEDIUM

  # Semantic category → label string (Outlook category or tag)
  categories:
    newsletter: "ReadLater/Newsletter"
    receipt: "Records/Receipt"
    spamCandidate: "SpamCandidate"
    triageAction: "Triage/Action"
    triageFYI: "Triage/FYI"
    scheduling: "Triage/Scheduling"
    approvalRequest: "Triage/Approval"

  # Semantic folder → human-readable folder name (executor resolves to ID)
  folders:
    archive: "Archive"
    inbox: "Inbox"

  # Emails/authors in this list → isPrioritySender: true
  senderAllowlist: []
    # - "boss@company.com"
    # - "cto@company.com"

  # Domains in this list → auto-classify SPAM candidate
  senderBlocklistDomains: []
    # - "cheap-deals.example"

  conflictResolution:
    # When TRIAGE is present, suppress MOVE actions
    triageBlocksMove: true

rules:
  # ============================================================
  # 1100 — Hard filters
  # ============================================================

  - id: blocklist-domain-spam
    priority: 1100
    when:
      any:
        - field: "from.email"
          op: domain_in
          value: "${defaults.senderBlocklistDomains}"
        - all:
            - field: "signals.isBulk"
              op: eq
              value: true
            - field: "signals.isAutomated"
              op: eq
              value: true
            - field: "signals.hasUnsubscribe"
              op: eq
              value: true
            - field: "title"
              op: matches
              value: "(?i)free money|get rich|winner|act now|limited time|congratulations"
    setClassification:
      intent: SPAM
      urgency: SOMEDAY
      risk: LOW
      confidence: 0.95
      rationale:
        - "Sender domain blocklist or strong spam heuristics matched."
    actions:
      - type: LABEL
        name: "${defaults.categories.spamCandidate}"
      - type: MOVE
        folder: "${defaults.folders.archive}"
    terminal: true

  # ============================================================
  # 900 — Automated / bulk mail
  # ============================================================

  - id: newsletter-auto-archive
    priority: 900
    when:
      any:
        - field: "signals.hasUnsubscribe"
          op: eq
          value: true
        - all:
            - field: "signals.isBulk"
              op: eq
              value: true
            - field: "signals.isAutomated"
              op: eq
              value: true
    setClassification:
      intent: NEWSLETTER
      urgency: SOMEDAY
      risk: LOW
      confidence: 0.90
      rationale:
        - "Bulk/automated indicators (unsubscribe or bulk+automated combined)."
    actions:
      - type: LABEL
        name: "${defaults.categories.newsletter}"
      - type: MOVE
        folder: "${defaults.folders.archive}"
    terminal: true

  - id: receipt-auto-archive
    priority: 880
    when:
      all:
        - field: "signals.mentionsMoney"
          op: eq
          value: true
        - any:
            - field: "title"
              op: matches
              value: "(?i)receipt|invoice|order|payment|paid|statement"
            - field: "snippet"
              op: matches
              value: "(?i)receipt|invoice|order|payment|paid|total|amount"
    setClassification:
      intent: RECEIPT
      urgency: SOMEDAY
      risk: LOW
      confidence: 0.90
      rationale:
        - "Money mention plus receipt/invoice/order/payment keywords."
    actions:
      - type: LABEL
        name: "${defaults.categories.receipt}"
      - type: MOVE
        folder: "${defaults.folders.archive}"
    terminal: true

  # ============================================================
  # 700 — Scheduling / coordination
  # ============================================================

  - id: scheduling-triage
    priority: 700
    when:
      any:
        - field: "signals.mentionsMeeting"
          op: eq
          value: true
        - field: "extracted.intent"
          op: eq
          value: SCHEDULING
        - field: "source"
          op: eq
          value: calendar
    setClassification:
      intent: SCHEDULING
      urgency: THIS_WEEK
      risk: MEDIUM
      confidence: 0.82
      rationale:
        - "Meeting/scheduling signals or calendar source."
    actions:
      - type: LABEL
        name: "${defaults.categories.scheduling}"
      - type: TRIAGE
        question: "This appears to be a scheduling item. Accept, decline, or tentatively accept?"
    terminal: true

  # ============================================================
  # 600 — Approval requests
  # ============================================================

  - id: approval-request-triage
    priority: 600
    when:
      any:
        - field: "extracted.intent"
          op: eq
          value: APPROVAL_REQUEST
        - field: "title"
          op: matches
          value: "(?i)approve|sign[- ]?off|permission|can you confirm|please confirm|needs your approval"
        - field: "snippet"
          op: matches
          value: "(?i)please approve|your approval|sign off|needs approval"
    setClassification:
      intent: APPROVAL_REQUEST
      urgency: NOW
      risk: HIGH
      confidence: 0.85
      rationale:
        - "Approval/sign-off language detected."
    actions:
      - type: LABEL
        name: "${defaults.categories.approvalRequest}"
      - type: TRIAGE
        question: "This appears to require a decision or approval. What action should be taken?"
    terminal: true

  # ============================================================
  # 500 — Action required
  # ============================================================

  - id: action-required-triage
    priority: 500
    when:
      any:
        - field: "signals.isActionRequest"
          op: eq
          value: true
        - field: "extracted.intent"
          op: eq
          value: ACTION_REQUIRED
        - field: "title"
          op: matches
          value: "(?i)action required|please|can you|could you|request|follow.?up"
    setClassification:
      intent: ACTION_REQUIRED
      urgency: THIS_WEEK
      risk: MEDIUM
      confidence: 0.80
      rationale:
        - "Action/request cues detected in signals or subject."
    actions:
      - type: LABEL
        name: "${defaults.categories.triageAction}"
      - type: FLAG
        flagStatus: flagged
      - type: TRIAGE
        question: "This email appears to require action. What would you like to do?"
    terminal: true

  # ============================================================
  # 300 — FYI / informational
  # ============================================================

  - id: fyi-skip
    priority: 300
    when:
      any:
        - field: "extracted.intent"
          op: eq
          value: FYI
        - all:
            - field: "signals.isAutomated"
              op: eq
              value: false
            - field: "signals.isActionRequest"
              op: eq
              value: false
            - field: "signals.isBulk"
              op: eq
              value: false
    setClassification:
      intent: FYI
      urgency: SOMEDAY
      risk: LOW
      confidence: 0.78
      rationale:
        - "No action cues; non-automated, non-bulk — treat as informational."
    actions:
      - type: LABEL
        name: "${defaults.categories.triageFYI}"
      - type: ARCHIVE
    terminal: true

  # ============================================================
  # 0 — Fallback
  # ============================================================

  - id: fallback-unknown-triage
    priority: 0
    when:
      any:
        - field: "extracted.confidence"
          op: lte
          value: 0.74
        - field: "extracted.intent"
          op: eq
          value: UNKNOWN
    setClassification:
      intent: UNKNOWN
      urgency: SOMEDAY
      risk: MEDIUM
      confidence: 0.50
      rationale:
        - "Insufficient confidence or intent unknown — human decision required."
    actions:
      - type: TRIAGE
        question: "Unclear what to do with this item. Options: keep, archive, create task, skip?"
    terminal: true
