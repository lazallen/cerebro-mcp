# Slack policy — Cerebro triage system
# Handles: Slack saved items (source: slack-saved)
id: slack-triage
version: 1.0.0

defaults:
  approvalThreshold: 0.75
  claudeRecommendThreshold: 0.60
  unknownIntentRisk: MEDIUM
  conflictResolution:
    triageBlocksMove: true

rules:
  - id: action-request-triage
    priority: 700
    when:
      any:
        - field: "signals.isActionRequest"
          op: eq
          value: true
        - field: "extracted.intent"
          op: eq
          value: ACTION_REQUIRED
    setClassification:
      intent: ACTION_REQUIRED
      urgency: THIS_WEEK
      risk: MEDIUM
      confidence: 0.82
      rationale: ["Slack message with action cues."]
    actions:
      - type: TRIAGE
        question: "This Slack message appears to require action. Create a task, reply, or skip?"
    terminal: true

  - id: meeting-scheduling
    priority: 600
    when:
      field: "signals.mentionsMeeting"
      op: eq
      value: true
    setClassification:
      intent: SCHEDULING
      urgency: THIS_WEEK
      risk: MEDIUM
      confidence: 0.80
      rationale: ["Scheduling signals in Slack message."]
    actions:
      - type: TRIAGE
        question: "This Slack message mentions a meeting. Accept, add to calendar, or skip?"
    terminal: true

  - id: fyi-skip
    priority: 200
    when:
      all:
        - field: "signals.isActionRequest"
          op: eq
          value: false
        - field: "signals.mentionsMeeting"
          op: eq
          value: false
    setClassification:
      intent: FYI
      urgency: SOMEDAY
      risk: LOW
      confidence: 0.75
      rationale: ["Informational Slack message."]
    actions:
      - type: SKIP
    terminal: true

  - id: fallback-triage
    priority: 0
    when:
      field: "source"
      op: eq
      value: slack-saved
    setClassification:
      intent: UNKNOWN
      urgency: SOMEDAY
      risk: MEDIUM
      confidence: 0.50
      rationale: ["No rule matched."]
    actions:
      - type: TRIAGE
        question: "What should be done with this Slack item?"
    terminal: true
